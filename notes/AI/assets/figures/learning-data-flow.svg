<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">训练、验证、测试与推理的数据用途</title>
  <desc id="desc">训练数据拟合预处理和模型，验证数据用于选择方案，锁定完整方案后才使用测试数据作最终评价。测试评价没有返回训练的箭头。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#475569"/></marker></defs>
  <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172b44}.h{font-size:31px;font-weight:700}.t{font-size:25px;font-weight:600}.s{font-size:21px;fill:#40546b}.a{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.box{stroke-width:2;rx:16}</style>
  <rect width="1200" height="720" rx="22" fill="#f8fafc"/>
  <text x="42" y="56" class="h">学习闭环：数据怎样影响最终方案</text>
  <text x="42" y="94" class="s">训练学参数 · 验证选方案 · 测试估计表现 · 推理复用已确定的方案</text>
  <rect x="42" y="150" width="236" height="100" class="box" fill="#e5f4ed" stroke="#348461"/>
  <text x="160" y="190" class="t" text-anchor="middle">训练数据</text><text x="160" y="225" class="s" text-anchor="middle">输入 + 目标</text>
  <rect x="390" y="150" width="330" height="100" class="box" fill="#e5f4ed" stroke="#348461"/>
  <text x="555" y="190" class="t" text-anchor="middle">拟合预处理与模型</text><text x="555" y="225" class="s" text-anchor="middle">学习统计量与参数</text>
  <rect x="868" y="150" width="290" height="100" class="box" fill="#e5f4ed" stroke="#348461"/>
  <text x="1013" y="190" class="t" text-anchor="middle">候选预测方案</text><text x="1013" y="225" class="s" text-anchor="middle">含特征处理状态</text>
  <path d="M278 200H382" class="a"/><path d="M720 200H860" class="a"/>
  <rect x="42" y="330" width="236" height="100" class="box" fill="#edf0ff" stroke="#7572b3"/>
  <text x="160" y="370" class="t" text-anchor="middle">验证数据</text><text x="160" y="405" class="s" text-anchor="middle">保持独立拟合边界</text>
  <rect x="390" y="330" width="330" height="100" class="box" fill="#edf0ff" stroke="#7572b3"/>
  <text x="555" y="370" class="t" text-anchor="middle">应用变换并评价</text><text x="555" y="405" class="s" text-anchor="middle">复用候选方案的状态</text>
  <rect x="868" y="330" width="290" height="100" class="box" fill="#edf0ff" stroke="#7572b3"/>
  <text x="1013" y="370" class="t" text-anchor="middle">选择模型与配置</text><text x="1013" y="405" class="s" text-anchor="middle">可比较多组候选方案</text>
  <path d="M278 380H382" class="a"/><path d="M720 380H860" class="a"/>
  <path d="M1013 250V285H555V322" class="a"/>
  <text x="693" y="278" class="s">候选方案</text>
  <rect x="42" y="525" width="236" height="100" class="box" fill="#fff2df" stroke="#b98331"/>
  <text x="160" y="565" class="t" text-anchor="middle">测试数据</text><text x="160" y="600" class="s" text-anchor="middle">确定方案后使用</text>
  <rect x="390" y="525" width="330" height="100" class="box" fill="#fff2df" stroke="#b98331"/>
  <text x="555" y="565" class="t" text-anchor="middle">最终评价</text><text x="555" y="600" class="s" text-anchor="middle">不再据此调整方案</text>
  <rect x="868" y="525" width="290" height="100" class="box" fill="#e4edf6" stroke="#527494"/>
  <text x="1013" y="565" class="t" text-anchor="middle">锁定完整方案</text><text x="1013" y="600" class="s" text-anchor="middle">可用于新输入推理</text>
  <path d="M278 575H382" class="a"/><path d="M868 575H728" class="a"/><path d="M1013 430V517" class="a"/>
  <text x="42" y="680" class="s">概念示意；最终按预定流程重训时，仍需完整保留独立测试边界。</text>
</svg>
